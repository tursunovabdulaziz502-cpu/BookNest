<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Document</title>
</head>
<body>
    <div class="modal" id="modal">
    <div class="box">
        <div class="tabs">
            <span class="tab on" id="tabLogin">Log in</span>
            <span class="tab" id="tabSign">Sign up</span>
        </div>

        <input type="text" id="name" class="hidden" placeholder="Your name">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="pass" placeholder="Password (min 6 characters)">

        <p class="error" id="error"></p>

        <button class="enter">Log in</button>
        <p class="close">Close</p>
    </div>
</div>
    
</body>
</html>
